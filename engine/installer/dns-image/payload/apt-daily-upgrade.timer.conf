# DNS appliance: the role's install time, one hour before its reboot window,
# rendered by dns-finish-install. The empty OnCalendar= drops Debian's
# randomized default schedule; a missed install is not run at boot.
[Timer]
OnCalendar=
OnCalendar=*-*-* @@INSTALL_TIME@@:00 Asia/Seoul
RandomizedDelaySec=0
Persistent=false
