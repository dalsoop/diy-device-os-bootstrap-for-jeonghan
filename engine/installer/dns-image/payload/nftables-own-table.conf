# nftables.service drop-in. Debian stops the service with `nft flush ruleset`,
# which would also remove the overlay clients' tables. Stop deletes only the
# appliance table (destroy tolerates its absence); reload re-applies the file,
# which recreates only that table.
[Service]
ExecStop=
ExecStop=/usr/sbin/nft destroy table inet dns_appliance
ExecReload=
ExecReload=/usr/sbin/nft -f /etc/nftables.conf
