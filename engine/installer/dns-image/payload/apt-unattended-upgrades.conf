// DNS appliance: unattended Debian upgrades.
// Read after 20auto-upgrades and 50unattended-upgrades, so these values win.
// "always" makes each run of the scheduled apt services act; the per-role
// apt-daily-upgrade.timer drop-in alone decides when the install happens.
// The upgrade origins stay Debian's defaults from 50unattended-upgrades
// (stable point release and security). dns-appliance-reboot.timer owns the
// reboot.
APT::Periodic::Update-Package-Lists "always";
APT::Periodic::Unattended-Upgrade "always";
Unattended-Upgrade::Automatic-Reboot "false";
