apiVersion: device-os.bootstrap/v1alpha1
kind: World

metadata:
  name: Jeonghan Home
  slug: jeonghan-home
  lifecycle: draft

spec:
  defaultMedia: dns-install

  overlays:
    - tailscale
    - netbird

  assets:
    - id: hp-dns-01
      type: computer
      inventoryRef: os-installs/dns01/hardware.conf
    - id: hp-dns-02
      type: computer
      inventoryRef: os-installs/dns02/hardware.conf
    - id: hp-dns-03
      type: computer
      inventoryRef: os-installs/dns03/hardware.conf

  # The LAN, router, management range, node addresses and NetBird range come
  # from this plan: a reviewed preset (engine/world/presets/network-plans.yaml)
  # plus any field overridden here. engine/world/bin/render-network-plan
  # --write regenerates os-installs/<role>/os.conf from it.
  networkPlan:
    preset: home-10-77

  networks:
    - id: home-lan
      assurance: planned-unverified

  nodes:
    - id: dns01
      assetRef: hp-dns-01
      role: dns-appliance
      networkRef: home-lan
    - id: dns02
      assetRef: hp-dns-02
      role: dns-appliance
      networkRef: home-lan
    - id: dns03
      assetRef: hp-dns-03
      role: dns-appliance
      networkRef: home-lan

  services:
    - id: dns-cluster
      type: authoritative-and-recursive-dns
      members:
        - dns01
        - dns02
        - dns03

  media:
    - id: dns-install
      entries:
        - dns-appliance
      language: ko-KR
    - id: inventory-capture
      entries:
        - debian-live
      language: ko-KR

  policies:
    unattendedInstall: guarded
    requireExactHardwareMatch: true
    requireSingleInternalTargetDisk: true
    requireTargetSpecificEraseConfirmation: true
    automaticBootTimeout: disabled
