apiVersion: homelab.gujo.dev/v1alpha1
kind: WorldPlaybook

metadata:
  name: Gujo DNS Device OS Bootstrap for Jeonghan

spec:
  timezone: Asia/Seoul
  drafts:
    - slug: gujo-home-dns
      path: drafts/gujo-home-dns/world.yaml
  generations:
    root: worlds
    idFormat: "{YYYYMMDDHHmmss}-{world-slug}"
    publishAfter: verified-physical-usb-write
