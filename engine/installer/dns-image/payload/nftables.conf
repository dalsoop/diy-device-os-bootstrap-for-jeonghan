#!/usr/sbin/nft -f
# Appliance firewall template. dns-finish-install renders it from the role
# profile, /etc/dns-appliance/overlays and the embedded role profiles: a line
# marked for one overlay stays only when that overlay is selected, and any
# marker left after rendering stops the install.
#
# The firewall owns only the table inet dns_appliance. Loading this file
# creates the table if absent, deletes it and recreates it in one transaction,
# so a load is idempotent and every other table, including the overlay
# clients' tables, stays untouched. It never flushes the ruleset.

table inet dns_appliance
delete table inet dns_appliance

table inet dns_appliance {
    # Overlay port limits. The NetBird client inserts `iifname "wt0" accept`
    # at the top of every input and forward filter chain it does not own,
    # including the input chain below, and re-inserts it after any change;
    # it never touches prerouting chains. Traffic that arrives on a selected
    # overlay interface for this host is limited here, before any input chain
    # runs. The overlay access policy decides which peers reach these ports.
    chain overlay_prerouting {
        type filter hook prerouting priority filter; policy accept;

        iifname != { @@OVERLAY_INTERFACES@@ } accept
        fib daddr type != { local, broadcast, multicast } accept
        ct state established,related accept
        ct state invalid drop
        meta l4proto { icmp, ipv6-icmp } accept
        udp dport 53 accept
        tcp dport { 22, 53, 9090, 9100, 53443 } accept
        drop
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        # Overlay source ranges are trusted only on their own interface.
        @@TAILSCALE@@iifname != "tailscale0" ip saddr 100.64.0.0/10 drop
        @@NETBIRD@@iifname != "wt0" ip saddr @@NETBIRD_RANGE@@ drop
        ct state established,related accept
        ct state invalid drop

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        ip saddr @@LAN_CIDR@@ udp dport 53 accept
        ip saddr @@LAN_CIDR@@ tcp dport 53 accept
        ip saddr { @@CLUSTER_PEERS@@ } tcp dport 53443 accept
        ip saddr @@MANAGEMENT_CIDR@@ tcp dport { 22, 9090, 9100, 53443 } accept

        @@TAILSCALE@@iifname "tailscale0" udp dport 53 accept
        @@TAILSCALE@@iifname "tailscale0" tcp dport { 22, 53, 9090, 9100, 53443 } accept
        @@NETBIRD@@iifname "wt0" udp dport 53 accept
        @@NETBIRD@@iifname "wt0" tcp dport { 22, 53, 9090, 9100, 53443 } accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
